name: Normalize Tauri icons
on:
  push:
    branches:
      - feat/category-concept-maps
permissions:
  contents: write
jobs:
  fix-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/category-concept-maps
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert legacy RGB PNGs to correct RGBA sizes
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          folder = Path("src-tauri/icons")
          for filename, expected in [
              ("32x32.png", (32, 32)),
              ("128x128.png", (128, 128)),
              ("128x128@2x.png", (256, 256)),
          ]:
              path = folder / filename
              with Image.open(path) as source:
                  if source.mode == "RGBA" and source.size == expected:
                      print("ALREADY_RGBA:", path, source.size)
                      continue
                  fixed = source.convert("RGBA").resize(expected, Image.Resampling.LANCZOS)
                  fixed.save(path, format="PNG", optimize=True)
                  print("CONVERTED:", path, source.mode, source.size, "-> RGBA", expected)
          PY
      - name: Commit corrected PNG assets to feature branch
        run: |
          git add src-tauri/icons/32x32.png src-tauri/icons/128x128.png src-tauri/icons/128x128@2x.png
          if git diff --cached --quiet; then
            echo "No image changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(tauri): normalize application PNG icons to RGBA"
          git push origin HEAD:feat/category-concept-maps
