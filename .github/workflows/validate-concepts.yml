name: Validate concept map changes
on:
  push:
    branches:
      - feat/category-concept-maps
  pull_request:
    branches:
      - main
permissions:
  contents: read

jobs:
  frontend:
    name: Svelte, TypeScript, build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Check Svelte and TypeScript
        run: pnpm check
      - name: Build web interface
        run: pnpm build
      - name: Existing unit tests
        shell: bash
        run: |
          pnpm run test:flows
          pnpm run test:home-text
          pnpm run test:link-comments
          pnpm run test:linked-notes
          pnpm run test:quick-texts
          pnpm run test:note-tags
          pnpm run test:concepts
          pnpm run test:concept-viewport
          pnpm run test:concept-hierarchy

  backend:
    name: Tauri Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux requirements for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Check Rust backend
        working-directory: src-tauri
        run: cargo check
      - name: Run backend tests
        working-directory: src-tauri
        run: cargo test

  windows:
    name: Windows Svelte and Tauri validation
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Check Svelte and TypeScript
        run: pnpm check
      - name: Build frontend
        run: pnpm build
      - name: Check Tauri on Windows
        working-directory: src-tauri
        run: cargo check
      - name: Test Tauri on Windows
        working-directory: src-tauri
        run: cargo test
